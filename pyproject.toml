[project]
name = "transit-design"
version = "0.1.0"
description = "Learning to Design City-scale Transit Routes using Reinforcement Learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Core simulation dependencies
    "numpy>=2.0",
    "matplotlib>=3.9",
    "seaborn>=0.13.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    "scipy>=1.14",
    "pandas>=2.2",
    "dill>=0.3.8",
    "networkx>=3.3",
    # RL core dependencies
    "torch>=2.10",
    "torch-geometric>=2.6",
    "gymnasium>=1.0",
    # ML experiment tracking
    "wandb>=0.19",
    "imageio>=2.37.2",
]

[project.optional-dependencies]
advanced = [
    "neatnet>=0.1.1",
    "osmnx>=2.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uxsim", "rl", "baselines"]

[tool.uv]
# For free-threading experiments, add: python-preference = "cpython-freethreaded"
